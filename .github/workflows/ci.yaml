name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # The test suite is pure logic, so it runs anywhere; tests/conftest.py stands in for the
  # macOS-only modules (Quartz, ApplicationServices, ocrmac) that cannot be installed here.
  # The lock marks every platform-only package, so this installs exactly the locked versions
  # of the rest, on the oldest Python the project supports.
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest -q

  # infra/gcp and scripts/osworld-gcp, checked with no credentials: nothing here reaches a cloud.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/gcp
      - run: terraform -chdir=infra/gcp init -backend=false -input=false
      - run: terraform -chdir=infra/gcp validate
      - run: terraform -chdir=infra/gcp test
      - run: bash -n scripts/osworld-gcp && bash -n infra/gcp/startup.sh
      - run: shellcheck scripts/osworld-gcp infra/gcp/startup.sh
      - run: scripts/osworld-gcp --dry-run status
