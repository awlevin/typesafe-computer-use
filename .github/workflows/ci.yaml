name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # The test suite is pure logic, so it runs anywhere; tests/conftest.py stands in for the
  # macOS-only modules (Quartz, ApplicationServices, ocrmac) that cannot be installed here.
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv python install 3.12
      - run: uv venv --python 3.12
      - run: uv pip install pillow anthropic==1.6.0 typesafe-sdk==0.6.0 pytest==9.1.1 ruff==0.16.8
      - run: uv pip install -e . --no-deps
      - run: uv run --no-project pytest -q
