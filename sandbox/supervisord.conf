; The sandbox's desktop: a virtual display, a window manager, and a way to watch it.
; All of it runs as the unprivileged `agent` user; supervisord restarts anything that exits.

[program:xvfb]
command=Xvfb :99 -screen 0 1440x900x24 -nolisten tcp
user=agent
priority=10
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:openbox]
command=openbox
user=agent
environment=DISPLAY=":99",HOME="/home/agent"
priority=20
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

; VNC listens inside the container only; noVNC serves it on 6080, which compose publishes on the
; host's loopback address alone.
[program:x11vnc]
command=x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5900 -quiet
user=agent
priority=30
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
user=agent
priority=40
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true
